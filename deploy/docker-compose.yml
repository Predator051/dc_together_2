# Usage (from this folder): docker compose up -d --build
# Settings live in .env next to this file (see .env.example).
# Part two has its own project name, so it never touches part one's containers on the same server.
name: bezgomin2
services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      INVITE_CODE: ${INVITE_CODE:-}
    volumes:
      - ./data:/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8444}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
